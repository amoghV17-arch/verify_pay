services:
  postgres:
    image: postgres:16-alpine
    container_name: milestone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: milestone
      POSTGRES_PASSWORD: milestone
      POSTGRES_DB: milestone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestone -d milestone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

